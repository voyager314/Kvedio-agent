# kvedio_agent 用户配置
# 位置：~/.kvedio_agent/config.yml
#
# 每个角色对应一个模型；更换模型改这里，重启程序生效。
#
# url 是完整的请求地址，程序直接使用：不在其后拼接路径，也不改写末尾的斜杠。
# 各家路径不同，照服务商文档填写，例如：
#   对话补全  https://api.deepseek.com/v1/chat/completions
#   语音转写  https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions
#   视觉理解  https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
#
# api_key 支持两种写法：
#   api_key: env:DASHSCOPE_API_KEY   # 引用环境变量，推荐
#   api_key: sk-...                  # 直接写入，注意本文件权限

supervisor:
  model: deepseek-chat
  url: https://api.deepseek.com/v1/chat/completions
  api_key: env:DEEPSEEK_API_KEY

# 默认本地docker起fast-whisper，用户可替换兼容openai收发协议的其它供应商
asr:
  model: Systran/faster-whisper-large-v3
  url: http://127.0.0.1:8000/v1/audio/transcriptions
  api_key: local

video:
  model: qwen-vl-max
  url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  api_key: env:DASHSCOPE_API_KEY

embedding:
  model: text-embedding-v3
  url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
  api_key: env:DASHSCOPE_API_KEY

runtime:
  # 接受的最长源视频时长，单位秒。
  max_video_duration_seconds: 7200
  # 作业产物保留天数；源视频从不删除。
  retention_days: 30
  # 同时运行的任务数上限。
  max_global_workers: 6
  # 单次上游调用的超时，单位秒。
  request_timeout_seconds: 600
  # 单个阶段的时间预算下限，单位秒；预算按媒体时长推导，不足此值时取此值。
  # 内置倍率：探测 0.05、音轨 0.5、转写 1.5、记忆 0.5、场景 1.5、事件 0.5；
  # 作答按请求超时的 6 倍，初步结论按 3 倍。
  stage_budget_floor_seconds: 300
  # 预算整体倍数：机器较慢可调大，想更早发现停滞可调小。
  stage_budget_scale: 1.0
  # 所有阶段预算的硬上限，单位秒；0 表示不设上限。
  stage_budget_ceiling_seconds: 0
  # 单次转写请求承载的音频长度，单位秒。
  asr_chunk_seconds: 300
  # 同时发出的转写请求数。
  asr_concurrency: 1
  # 覆盖图每一块覆盖的时长，单位秒。
  coverage_block_seconds: 180
  # 固定机位没有剪辑点，超过这个时长的镜头等分后再描述。
  scene_max_seconds: 90
  # 产物目录；null 表示 ~/.kvedio_agent/workspace。
  workspace_dir: null
