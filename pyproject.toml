[project]
name = "kvedio-agent"
version = "0.1.0"
description = "Local long-video analysis terminal agent"
readme = "README.md"
authors = [
    { name = "voyger314", email = "1429796980@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av>=14,<18",
    "av>=14,<18",
    "pydantic>=2.8,<3.0",
    "rich>=13.0,<14.0",
    "typer>=0.12,<1.0",
]

[project.scripts]
kvedio-agent = "kvedio_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvedio_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "eval",
    "temp",
    "dist",
    "EXECUTION_PLAN.md",
    ".env",
    "**/.env",
    "**/.env.*",
    "**/settings.json",
    "**/state.json",
    ".venv",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5.0", "mypy>=1.10"]

