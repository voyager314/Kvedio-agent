[project]
name = "kvedio-agent1"
version = "0.1.0"
description = "Local-first multi-agent long-video understanding agent for the terminal"
readme = "README.md"
authors = [
    { name = "voyager314", email = "1429796980@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av>=19.0.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
kvedio-agent1 = "kvedio_agent1:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
